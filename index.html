<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhận diện biển số → Google Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-card {
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    #cameraBox {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 300px;
    }
    #video {
      width: 100%;
      display: block;
      background: #000;
    }
    #plateGuide {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 32%;
      height: 36%;
      border: 3px solid #00ff66;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.28);
      pointer-events: none;
    }
    #guideText {
      position: absolute;
      left: 0;
      right: 0;
      top: 25%;
      color: white;
      text-align: center;
      font-weight: 700;
      text-shadow: 0 1px 5px #000;
      pointer-events: none;
    }
    #canvas { display: none; }
    .btn-primary, .btn-success {
      border: none;
      padding: 12px 24px;
      font-weight: 600;
      border-radius: 10px;
    }
    .alert-custom { border-radius: 12px; }
    #previewImage {
      width: 100%;
      border-radius: 10px;
      margin-top: 8px;
    }
    .plate-input {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .small-note {
      font-size: 12px;
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <div class="app-card bg-white p-4 mx-auto">

      <div class="text-center mb-4">
        <h2 class="mb-1">📷 Nhận diện biển số xe</h2>
        <p class="text-muted mb-0">Xe 2 bánh và 4 bánh</p>
      </div>

      <div class="text-center mb-3">
        <button id="startBtn" class="btn btn-primary btn-lg w-100" onclick="startCamera()">
          🎥 BẬT CAMERA
        </button>

        <button id="captureBtn" class="btn btn-success btn-lg w-100 d-none" onclick="capturePlate()">
          📸 CHỤP & NHẬN DIỆN BIỂN SỐ
        </button>

        <button id="stopBtn" class="btn btn-secondary btn-lg w-100 d-none mt-2" onclick="stopCamera()">
          ⏹ TẮT CAMERA
        </button>
      </div>

      <div id="cameraBox" class="mb-3">
        <video id="video" autoplay playsinline muted></video>
        <div id="plateGuide"></div>
        <div id="guideText">Đưa biển số vào trong khung</div>
      </div>

      <canvas id="canvas"></canvas>

      <div id="ocrStatus" class="alert alert-info alert-custom d-none"></div>

      <div id="previewContainer" class="d-none">
        <h6 class="mt-3">📷 Ảnh đã chụp</h6>
        <img id="previewImage" alt="Ảnh biển số">
      </div>

      <div id="successBox" class="alert alert-success alert-custom d-none mt-3">
        <h5 class="mb-3">✅ Đã nhận diện biển số</h5>

        <label class="form-label">Biển số xe:</label>
        <input
          id="plateInput"
          class="form-control plate-input mb-2"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false">

        <div class="small-note mb-3">
          Kiểm tra và sửa biển số nếu OCR nhận diện chưa chính xác.
        </div>

        <button class="btn btn-success w-100" onclick="openForm()">
          🚀 MỞ GOOGLE FORM
        </button>

        <button class="btn btn-outline-primary w-100 mt-2" onclick="restart()">
          🔄 QUÉT BIỂN SỐ KHÁC
        </button>
      </div>

      <div id="errorBox" class="alert alert-warning alert-custom d-none mt-3"></div>

      <div class="mt-3 text-center text-muted small">
        <strong>"Đây là link tự động nhận diện biển số xe vào Google Form của BQTT"</strong>
        <br>designed by Dat Le
      </div>

    </div>
  </div>

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSepI3fNsWtlduG7QtnlwfhUlqFqD49JF3PDOntyEhYcedv8mA/viewform";
    const ENTRY_ID = "877688537";

    let videoStream = null;
    let scannedData = null;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    async function startCamera() {
      hideMessages();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("❌ Trình duyệt không hỗ trợ Camera. Hãy mở trang bằng HTTPS.");
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = videoStream;
        await video.play();

        document.getElementById("startBtn").classList.add("d-none");
        document.getElementById("captureBtn").classList.remove("d-none");
        document.getElementById("stopBtn").classList.remove("d-none");
      } catch (err) {
        showError(
          "❌ Không thể mở camera.<br><br>" +
          err.message +
          "<br><br>👉 Hãy cấp quyền Camera cho trình duyệt."
        );
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }

      video.srcObject = null;

      document.getElementById("startBtn").classList.remove("d-none");
      document.getElementById("captureBtn").classList.add("d-none");
      document.getElementById("stopBtn").classList.add("d-none");
    }

    async function capturePlate() {
      if (!videoStream) {
        showError("❌ Camera chưa được bật.");
        return;
      }

      const width = video.videoWidth;
      const height = video.videoHeight;

      if (!width || !height) {
        showError("❌ Camera chưa sẵn sàng. Vui lòng thử lại.");
        return;
      }

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(video, 0, 0, width, height);

      const imageData = canvas.toDataURL("image/jpeg", 0.95);
      document.getElementById("previewImage").src = imageData;
      document.getElementById("previewContainer").classList.remove("d-none");

      await recognizePlate();
    }

    function makeProcessedCanvas(sourceCanvas, mode) {
      const c = document.createElement("canvas");
      const scale = 1.5;
      c.width = Math.round(sourceCanvas.width * scale);
      c.height = Math.round(sourceCanvas.height * scale);

      const cctx = c.getContext("2d");
      cctx.drawImage(sourceCanvas, 0, 0, c.width, c.height);

      const imageData = cctx.getImageData(0, 0, c.width, c.height);
      const d = imageData.data;

      for (let i = 0; i < d.length; i += 4) {
        let gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];

        if (mode === "contrast") {
          gray = (gray - 128) * 1.8 + 128;
          gray = Math.max(0, Math.min(255, gray));
        }

        if (mode === "threshold") {
          gray = gray > 145 ? 255 : 0;
        }

        d[i] = gray;
        d[i + 1] = gray;
        d[i + 2] = gray;
      }

      cctx.putImageData(imageData, 0, 0);
      return c;
    }

    async function recognizePlate() {
      const status = document.getElementById("ocrStatus");

      status.className = "alert alert-info alert-custom";
      status.classList.remove("d-none");
      status.innerHTML = "🔍 Đang xử lý ảnh và nhận diện biển số...";

      try {
        /*
          Chạy OCR trên 3 phiên bản ảnh:
          1. ảnh gốc
          2. tăng tương phản
          3. threshold
        */
        const images = [
          canvas,
          makeProcessedCanvas(canvas, "contrast"),
          makeProcessedCanvas(canvas, "threshold")
        ];

        let allText = [];

        for (let i = 0; i < images.length; i++) {
          status.innerHTML =
            "🔍 Đang nhận diện biển số... (" + (i + 1) + "/3)";

          const result = await Tesseract.recognize(images[i], "eng", {
            logger: function(info) {
              if (info.status === "recognizing text") {
                const percent = Math.round(info.progress * 100);
                status.innerHTML =
                  "🔍 Đang nhận diện biển số... " +
                  percent + "%";
              }
            },
            tessedit_char_whitelist:
              "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-"
          });

          allText.push(result.data.text);
        }

        console.log("OCR RAW:", allText);

        const plate = findBestPlate(allText);

        if (!plate) {
          status.className = "alert alert-warning alert-custom";
          status.innerHTML =
            "⚠️ Chưa nhận diện rõ biển số.<br><br>" +
            "Hãy đưa biển số gần hơn, đủ sáng, không bị nghiêng quá nhiều rồi bấm chụp lại.";

          return;
        }

        scannedData = plate;
        document.getElementById("plateInput").value = plate;

        status.className = "alert alert-success alert-custom";
        status.innerHTML =
          "✅ Đã nhận diện: <strong>" + plate + "</strong>";

        document.getElementById("successBox").classList.remove("d-none");

        stopCamera();

        document.getElementById("successBox")
          .scrollIntoView({ behavior: "smooth" });

      } catch (err) {
        console.error(err);

        status.className = "alert alert-danger alert-custom";
        status.innerHTML = "❌ Lỗi nhận diện: " + err.message;
      }
    }

    function cleanOCR(text) {
      return text
        .toUpperCase()
        .replace(/[^A-Z0-9.\-\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function findBestPlate(texts) {
      const candidates = [];

      for (const raw of texts) {
        const s = cleanOCR(raw);
        const compact = s.replace(/[^A-Z0-9]/g, "");

        /*
          Mẫu biển số Việt Nam thường gặp:
          51F112345
          29A123456
          59B212345
        */
        const patterns = [
          /\b(\d{2}[A-Z]{1,2}\d{1,2})[\s.-]*(\d{3,5})\b/g,
          /\b(\d{2}[A-Z]{1,2})[\s.-]*(\d{1,2})[\s.-]*(\d{3,5})\b/g
        ];

        for (const pattern of patterns) {
          let m;
          while ((m = pattern.exec(s)) !== null) {
            const value = m[1] + (m[2] ? "" : "") +
                          (m[3] ? m[2] : "") +
                          "-" + (m[3] ? m[3] : m[2]);
            candidates.push(normalizePlate(value));
          }
        }

        const compactMatch =
          compact.match(/(\d{2}[A-Z]{1,2}\d{1,2})(\d{3,5})/);

        if (compactMatch) {
          candidates.push(
            compactMatch[1] + "-" + compactMatch[2]
          );
        }
      }

      /*
        Ưu tiên ứng viên hợp lệ.
      */
      const valid = candidates.filter(isLikelyPlate);

      if (valid.length) {
        /*
          Nếu nhiều kết quả, lấy kết quả xuất hiện nhiều nhất.
        */
        const count = {};
        valid.forEach(x => count[x] = (count[x] || 0) + 1);

        return valid.sort((a, b) =>
          count[b] - count[a]
        )[0];
      }

      /*
        Fallback: cố tìm một chuỗi giống biển số
        trong toàn bộ OCR.
      */
      for (const raw of texts) {
        const s = cleanOCR(raw);
        const fallback =
          s.match(/\d{2}[A-Z]{1,2}\d{1,2}[\s.-]*\d{3,5}/);

        if (fallback) {
          return normalizePlate(fallback[0]);
        }
      }

      return "";
    }

    function normalizePlate(value) {
      let s = value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

      const m = s.match(/^(\d{2})([A-Z]{1,2})(\d{1,2})(\d{3,5})$/);

      if (m) {
        return m[1] + m[2] + m[3] + "-" + m[4];
      }

      return value.toUpperCase().trim();
    }

    function isLikelyPlate(value) {
      const compact = value.replace(/[^A-Z0-9]/g, "");
      return /^\d{2}[A-Z]{1,2}\d{1,2}\d{3,5}$/.test(compact);
    }

    function openForm() {
      let plate = document
        .getElementById("plateInput")
        .value
        .trim()
        .toUpperCase();

      if (!plate) {
        alert("Chưa có biển số!");
        return;
      }

      /*
        Giữ dấu "-" để người dùng nhìn dễ,
        Google Form vẫn nhận đúng chuỗi.
      */
      scannedData = plate;

      const url =
        `${FORM_URL}?usp=pp_url&entry.${ENTRY_ID}=${encodeURIComponent(scannedData)}`;

      window.open(url, "_blank");
    }

    function restart() {
      scannedData = null;

      document.getElementById("successBox").classList.add("d-none");
      document.getElementById("previewContainer").classList.add("d-none");
      document.getElementById("ocrStatus").classList.add("d-none");
      document.getElementById("plateInput").value = "";

      startCamera();
    }

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.innerHTML = msg;
      box.classList.remove("d-none");
    }

    function hideMessages() {
      document.getElementById("errorBox").classList.add("d-none");
      document.getElementById("successBox").classList.add("d-none");
      document.getElementById("ocrStatus").classList.add("d-none");
    }
  </script>
</body>
</html>
