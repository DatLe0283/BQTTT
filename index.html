<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhận diện biển số</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* Chỉ hiển thị vùng quét ở giữa */
    #scanBox {
      position: absolute;
      left: 7%;
      width: 86%;
      top: 38%;
      height: 24%;
      border: 3px solid #00ff66;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.42);
      pointer-events: none;
    }

    #scanBox::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: rgba(0,255,102,.9);
      box-shadow: 0 0 8px #00ff66;
    }

    #message {
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 22px;
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      text-shadow: 0 1px 4px #000;
      z-index: 10;
    }

    #startBtn {
      position: absolute;
      z-index: 20;
      left: 8%;
      width: 84%;
      bottom: 85px;
      height: 52px;
      border: 0;
      border-radius: 12px;
      background: #0d6efd;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    #resultBox {
      position: absolute;
      z-index: 30;
      left: 5%;
      right: 5%;
      bottom: 70px;
      background: rgba(255,255,255,.97);
      border-radius: 16px;
      padding: 18px;
      display: none;
    }

    #plateInput {
      width: 100%;
      height: 54px;
      border: 2px solid #198754;
      border-radius: 10px;
      text-align: center;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #openFormBtn {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    #againBtn {
      width: 100%;
      height: 42px;
      margin-top: 8px;
      border: 1px solid #6c757d;
      border-radius: 10px;
      background: white;
      font-size: 15px;
    }

    #status {
      position: absolute;
      z-index: 15;
      left: 0;
      right: 0;
      top: 30%;
      text-align: center;
      color: white;
      font-size: 14px;
      text-shadow: 0 1px 4px #000;
      display: none;
    }

    #canvas {
      display: none;
    }
  </style>
</head>

<body>

<div id="app">

  <video id="video" autoplay playsinline muted></video>

  <div id="scanBox"></div>

  <div id="status">Đang nhận diện...</div>

  <button id="startBtn" onclick="startCamera()">
    🎥 BẬT CAMERA
  </button>

  <div id="message">
    Đây là link tự động nhận diện biển số để lưu vào google form
  </div>

  <div id="resultBox">
    <div style="text-align:center;font-size:15px;margin-bottom:8px;">
      Biển số nhận diện được
    </div>

    <input id="plateInput" type="text"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="characters"
           spellcheck="false">

    <button id="openFormBtn" onclick="openForm()">
      🚀 LƯU VÀO GOOGLE FORM
    </button>

    <button id="againBtn" onclick="restartScan()">
      🔄 QUÉT LẠI
    </button>
  </div>

  <canvas id="canvas"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
  const FORM_URL =
    "https://docs.google.com/forms/d/e/1FAIpQLSepI3fNsWtlduG7QtnlwfhUlqFqD49JF3PDOntyEhYcedv8mA/viewform";

  const ENTRY_ID = "877688537";

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  let stream = null;
  let worker = null;
  let scanning = false;
  let busy = false;
  let lastScan = 0;

  /*
   * Khởi động camera.
   */
  async function startCamera() {

    try {

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;

      await video.play();

      document.getElementById("startBtn").style.display = "none";
      document.getElementById("status").style.display = "block";

      scanning = true;

      /*
       * Tesseract worker chỉ khởi tạo một lần.
       * Điều này nhanh hơn nhiều so với tạo OCR mới
       * cho từng lần quét.
       */
      worker = await Tesseract.createWorker("eng", 1, {
        logger: function(info) {
          if (info.status === "recognizing text") {
            document.getElementById("status").textContent =
              "Đang nhận diện...";
          }
        }
      });

      await worker.setParameters({
        tessedit_char_whitelist:
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-",
        tessedit_pageseg_mode: "7"
      });

      scanLoop();

    } catch (err) {

      alert(
        "Không thể mở camera.\n\n" +
        err.message +
        "\n\nHãy cấp quyền Camera cho trình duyệt."
      );

    }
  }

  /*
   * Quét tự động.
   *
   * Chỉ lấy vùng trung tâm của camera,
   * không OCR toàn bộ hình ảnh.
   */
  async function scanLoop() {

    if (!scanning) return;

    const now = Date.now();

    /*
     * Không OCR liên tục từng frame.
     * 350 ms/lần giúp giảm tải CPU.
     */
    if (!busy && now - lastScan > 350) {

      lastScan = now;

      try {
        await scanCenter();

      } catch (e) {
        console.log(e);
      }
    }

    requestAnimationFrame(scanLoop);
  }

  /*
   * Cắt đúng vùng nằm trong khung xanh.
   */
  async function scanCenter() {

    if (!video.videoWidth || !video.videoHeight || !worker) {
      return;
    }

    busy = true;

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    /*
     * Tọa độ khung quét:
     * left 7%
     * width 86%
     * top 38%
     * height 24%
     */
    const sx = Math.floor(vw * 0.07);
    const sy = Math.floor(vh * 0.38);
    const sw = Math.floor(vw * 0.86);
    const sh = Math.floor(vh * 0.24);

    /*
     * Phóng đại vùng biển số.
     */
    const scale = 2;

    canvas.width = sw * scale;
    canvas.height = sh * scale;

    ctx.drawImage(
      video,
      sx, sy, sw, sh,
      0, 0, sw * scale, sh * scale
    );

    /*
     * Xử lý grayscale + tăng tương phản.
     */
    const image = ctx.getImageData(
      0, 0,
      canvas.width,
      canvas.height
    );

    const d = image.data;

    for (let i = 0; i < d.length; i += 4) {

      let gray =
        0.299 * d[i] +
        0.587 * d[i + 1] +
        0.114 * d[i + 2];

      gray = (gray - 128) * 1.6 + 128;

      gray = Math.max(0, Math.min(255, gray));

      d[i] = gray;
      d[i + 1] = gray;
      d[i + 2] = gray;
    }

    ctx.putImageData(image, 0, 0);

    const result =
      await worker.recognize(canvas);

    const text =
      result.data.text || "";

    const plate =
      findPlate(text);

    if (plate) {

      showResult(plate);

    }

    busy = false;
  }

  /*
   * Tìm chuỗi có cấu trúc giống biển số Việt Nam.
   */
  function findPlate(text) {

    let s = text
      .toUpperCase()
      .replace(/[^A-Z0-9.\-\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    if (!s) return "";

    /*
     * Sửa một số lỗi OCR thường gặp.
     */
    s = s
      .replace(/(\d)[OQ]/g, "$10")
      .replace(/[OQ](\d)/g, "0$1")
      .replace(/(\d)I/g, "$11")
      .replace(/I(\d)/g, "1$1");

    const compact =
      s.replace(/[^A-Z0-9]/g, "");

    /*
     * Ví dụ:
     * 51F112345
     * 59B212345
     * 29A12345
     */
    let match =
      compact.match(
        /(\d{2})([A-Z]{1,2})(\d{1,2})(\d{3,5})/
      );

    if (match) {

      return (
        match[1] +
        match[2] +
        match[3] +
        "-" +
        match[4]
      );
    }

    /*
     * Một số trường hợp OCR giữ dấu cách:
     * 51F1 12345
     */
    match =
      s.match(
        /(\d{2})([A-Z]{1,2})(\d{1,2})[\s.-]+(\d{3,5})/
      );

    if (match) {

      return (
        match[1] +
        match[2] +
        match[3] +
        "-" +
        match[4]
      );
    }

    return "";
  }

  /*
   * Khi nhận diện được biển số:
   * dừng OCR và hiển thị kết quả.
   */
  async function showResult(plate) {

    if (!scanning) return;

    scanning = false;

    if (stream) {
      stream.getTracks().forEach(
        track => track.stop()
      );
    }

    if (worker) {
      await worker.terminate();
      worker = null;
    }

    document.getElementById("plateInput").value = plate;

    document.getElementById("resultBox").style.display = "block";

    document.getElementById("status").style.display = "none";

  }

  /*
   * Mở Google Form với biển số.
   */
  function openForm() {

    const plate =
      document.getElementById("plateInput")
        .value
        .trim()
        .toUpperCase();

    if (!plate) {
      alert("Chưa có biển số.");
      return;
    }

    const url =
      `${FORM_URL}?usp=pp_url&entry.${ENTRY_ID}=${encodeURIComponent(plate)}`;

    window.open(url, "_blank");
  }

  /*
   * Quét lại.
   */
  function restartScan() {

    document.getElementById("resultBox").style.display = "none";

    startCamera();
  }

</script>

</body>
</html>
